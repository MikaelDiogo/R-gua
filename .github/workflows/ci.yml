name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Mesma imagem do compose, com as extensões (docs/12 §3.2). Testes de integração entram com a camada de dados.
      postgres:
        image: paradedb/paradedb:0.26.4-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agora"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ativar pnpm (versão do packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Auditoria de dependências (produção)
        run: pnpm audit --prod --audit-level high
      - name: Lint e formatação
        run: pnpm lint
      - name: Build (contracts primeiro, depois apps)
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes
        run: pnpm test
      - name: Extensões do Postgres presentes
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d agora -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_search;" -c "SELECT extname, extversion FROM pg_extension ORDER BY 1;"

  # Garante que as imagens de produção constroem (sem publicar). Ver infra/docker/Dockerfile.
  images:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagem api/worker/migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: node-runtime
          push: false
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max
      - name: Imagem web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: web-runtime
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Validar o compose de produção
        run: |
          sed 's/<trocar>/ci/' .env.production.example > /tmp/ci.env
          docker compose -f docker-compose.prod.yml --env-file /tmp/ci.env config --quiet
